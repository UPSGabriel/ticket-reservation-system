apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: ticket-system
  labels:
    app: payment-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: payment-service
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: payment-service
      containers:
        - name: payment-service
          image: upsgabriel/ticket-payment-service:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8003
          env:
            - name: INSTANCE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: PAYMENT_DELAY_SECONDS
              value: "0"
            - name: PAYMENT_MIN_DELAY_MS
              value: "100"
            - name: PAYMENT_MAX_DELAY_MS
              value: "800"
            - name: PAYMENT_FAILURE_RATE
              value: "0.05"
            - name: PAYMENT_FAILURE_MODE
              value: none
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              cpu: 400m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: ticket-system
  labels:
    app: payment-service
spec:
  type: ClusterIP
  selector:
    app: payment-service
  ports:
    - name: http
      port: 8003
      protocol: TCP
      targetPort: 8003
---
apiVersion: apps/v1
